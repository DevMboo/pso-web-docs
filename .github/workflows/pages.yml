name: Publish PSO Web documentation

on:
  push:
    branches: [main]
    paths:
      - docs-site/**
      - scripts/validate-site.mjs
      - .github/workflows/pages.yml
  workflow_dispatch:

concurrency:
  group: github-pages
  cancel-in-progress: false

jobs:
  validate:
    runs-on: ubuntu-latest
    permissions:
      contents: read
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '24'
      - name: Validate approved static artifact and internal links
        run: node scripts/validate-site.mjs docs-site
      - uses: actions/configure-pages@v5
      - uses: actions/upload-pages-artifact@v4
        with:
          path: docs-site

  deploy:
    needs: validate
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    permissions:
      pages: write
      id-token: write
    steps:
      - name: Deploy GitHub Pages
        id: deployment
        uses: actions/deploy-pages@v4
      - name: Report deployment URL
        run: echo "Published ${{ steps.deployment.outputs.page_url }}"
